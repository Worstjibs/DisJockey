<nav class="navbar navbar-dark bg-dark fixed-bottom">
  <input
    type="range"
    class="progress-slider"
    min="0"
    [max]="trackProgress()?.total ?? 0"
    [value]="trackProgress()?.elapsed ?? 0"
    [style.background]="sliderBackground()"
    (change)="onSeek($event)"
  />
  <div class="container">
    <div class="nav-left">
      @if (trackStatus(); as trackStatus) {
        <span class="navbar-text">Track Playing: {{ trackStatus.trackName }}</span>
      } @else {
        <span class="navbar-text">No track playing</span>
      }
    </div>
    <div class="nav-center">
      <button class="btn btn-link text-light" (click)="togglePlayPause()">
        <fa-icon [icon]="playPauseIcon" size="lg" />
      </button>
    </div>
    <div class="nav-right">
      @if (userStatus(); as userStatus) {
        <span class="navbar-text">Connected to: {{ userStatus.voiceChannelName }}</span>
      }
    </div>
  </div>
</nav>
