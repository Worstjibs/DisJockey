<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" routerLink="/"><img id="logo" src="icon.png" alt=""> DisJockey</a>

        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" routerLinkActive="active" routerLink="/members">Members</a>

            <li class="nav-item">
                <a class="nav-link" routerLinkActive="active" routerLink="/tracks">Tracks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" routerLinkActive="active" routerLink="/search">Search</a>

        </ul>

            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"

        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"

            </button>
