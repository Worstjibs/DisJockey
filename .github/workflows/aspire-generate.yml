name: Aspire Generate

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read
  issues: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-images:  
    defaults:
      run:
        shell: bash
        working-directory: ./DisJockey.AppHost

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install Angular app Modules
        run: npm install
        working-directory: ./DisJockey.Client

      - name: Install Aspire CLI
        run: dotnet tool install -g aspire.cli --prerelease

      - name: Aspire Publish
        run: aspire publish -o docker-compose-artifacts
        
      - name: Lowercase repository name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Aspire Push
        run: aspire do push
        env:
          Parameters__registry_endpoint: ghcr.io
          Parameters__registry_repository: ${{ env.REPO_LOWER }}

      - name: upload aspire output
        uses: actions/upload-artifact@v7
        with:
          name: aspire-publish-output
          path: ./DisJockey.AppHost/docker-compose-artifacts